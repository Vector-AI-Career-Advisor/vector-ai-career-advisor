services:

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: always
    environment:
      DOCKER_DB_HOST: postgres
      DB_PORT: 5432
      DOCKER_MCP_URL: http://mcp-db:8100/mcp
    env_file:
      - .env
    volumes:
      - ./server/db/chroma_db:/app/server/db/chroma_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-db:
        condition: service_started

  # Separate container, separate credential: this is the read-only path the
  # agent runtime uses to query Postgres (see scripts/sql/create_agent_role.sql
  # and server/mcp/). Deliberately NOT given `env_file: .env` — only the
  # two secrets it actually needs are passed explicitly below, so it can never
  # see DB_PASSWORD (the superuser DSN) or ANTHROPIC_API_KEY. Published to the
  # host on 8100 so external MCP clients (e.g. Claude) can connect directly;
  # AGENT_TOKEN_SECRET auth still gates access.
  mcp-db:
    build:
      context: .
      dockerfile: Dockerfile.server
    # Dockerfile.server's own WORKDIR is /app/server/web (so the `server`
    # service's `uvicorn main:app` resolves "main" as a top-level module
    # there). This service instead runs `python -m server.mcp.server`, whose
    # internal imports (e.g. `from server.mcp.auth import ...`) need `server`
    # to resolve as a top-level package — i.e. cwd two levels up, at /app.
    working_dir: /app
    command: ["python", "-m", "server.mcp.server"]
    restart: always
    environment:
      AGENT_DB_DSN: postgresql://vector_agent:${AGENT_DB_PASSWORD}@postgres:5432/${DB_NAME}
      AGENT_TOKEN_SECRET: ${AGENT_TOKEN_SECRET}
      MCP_PORT: 8100
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
      args:
        CHROME_VERSION: ${CHROME_VERSION}
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/career_assistant/server/etl/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres/airflow
    volumes:
      - .:/opt/career_assistant
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "airflow db init &&
      airflow users create --username airflow --password airflow --firstname Air --lastname Flow --role Admin --email airflow@example.com || true"
  
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
      args:
        CHROME_VERSION: ${CHROME_VERSION}
    restart: always
    environment:
      DOCKER_DB_HOST: postgres
      DB_PORT: 5432
      PYTHONPATH: /opt/career_assistant:/opt/career_assistant/server
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/career_assistant/server/etl/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres/airflow
    env_file:
      - .env
    volumes:
      - .:/opt/career_assistant
      - ./server/logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: airflow scheduler

  webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
      args:
        CHROME_VERSION: ${CHROME_VERSION}
    restart: always
    environment:
      DOCKER_DB_HOST: postgres
      DB_PORT: 5432
      PYTHONPATH: /opt/career_assistant:/opt/career_assistant/server
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/career_assistant/server/etl/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres/airflow
    env_file:
      - .env
    volumes:
      - .:/opt/career_assistant
      - ./server/logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: airflow webserver

volumes:
  postgres_data: